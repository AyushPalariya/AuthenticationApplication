server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Auth_Application}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Ayush@2003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AuthHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1800000
      idle-timeout: 600000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:palariyaayush96@gmail.com}
    password: ${MAIL_PASSWORD:rhfr awiz tskr vbrx}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
