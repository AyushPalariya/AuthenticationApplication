  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.AuthSecurity: DEBUG
    org.springframework.security: INFO

security:
  jwt:
    secret: ${JWT_SECRET:saiofaldsfsoierjfnn9884jsnavkasfbehwqpofhjashofjaswfpojasfvbafophfiiotorjdladjfbslafonf}
    issuer: ${JWT_ISSUER:api.authapp.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:4800}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:8640}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
